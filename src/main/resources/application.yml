spring:
  application:
    name: rate-limiting-service

  datasource:
    url: jdbc:postgresql://localhost:5432/rate_limit_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # cria/atualiza tabelas automaticamente a partir das entities
    show-sql: true        # mostra no console o SQL gerado
    properties:
      hibernate:
        format_sql: true

  redis:
    host: localhost
    port: 6379

server:
  port: 8080